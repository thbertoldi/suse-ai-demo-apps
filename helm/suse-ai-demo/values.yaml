gateway:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-gateway
    tag: latest
    pullPolicy: Always
  replicas: 1
  ragServiceAddr: rag-service:50052
  llmServiceAddr: llm-service:50053
  agentServiceAddr: agent-service:50054
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ragService:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-rag-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  llm:
    baseUrl: http://ollama.suse-private-ai.svc.cluster.local:11434/v1
    model: llama3.2
    provider: ollama
  embedding:
    baseUrl: http://ollama.suse-private-ai.svc.cluster.local:11434
    model: nomic-embed-text
  vectorDb:
    type: milvus
    url: http://milvus.suse-private-ai.svc.cluster.local:19530
    collection: demo_docs
    username: ""
    password: ""
  enableContentEvents: "false"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

llmService:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-llm-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  llm:
    baseUrl: http://ollama.suse-private-ai.svc.cluster.local:11434/v1
    model: llama3.2
    provider: ollama
  enableContentEvents: "false"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

agentService:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-agent-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  llm:
    baseUrl: http://ollama.suse-private-ai.svc.cluster.local:11434/v1
    model: llama3.2
    provider: ollama
  ragServiceAddr: rag-service:50052
  agentName: demo-agent
  maxIterations: "5"
  deterministicDemoTools: "true"
  enableContentEvents: "false"
  # The chart's direct Service selects the current Knative predictor pod and
  # avoids the Kubeflow browser/OIDC gateway used by the generated KServe URL.
  kservePredictUrl: http://suse-ai-sklearn-iris.kubeflow-user-example-com.svc.cluster.local/v1/models/sklearn-iris:predict
  modelRegistryUrl: http://model-registry-service.kubeflow.svc.cluster.local:8080
  # The default Kubeflow AuthorizationPolicy permits in-cluster API calls that
  # carry an Authorization header. Override or clear this token as appropriate.
  modelRegistryBearerToken: demo
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

trafficGen:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-traffic-gen
    tag: latest
    pullPolicy: Always
  enabled: true
  gatewayAddr: gateway:50051
  intervalSeconds: "5"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

kubeflowPipeline:
  inferenceServiceName: sklearn-iris
  # The successful pipeline smoke-test creates/updates this stable Service so
  # it selects only the newest ready Knative revision.
  predictionServiceName: suse-ai-sklearn-iris
  rbac:
    enabled: true
    # KFP runs the demo steps as this service account. Grant it only the
    # namespaced KServe and credential-object permissions needed by deployment.
    serviceAccountName: default-editor
    serviceAccountNamespace: kubeflow-user-example-com
    kserveNamespace: kubeflow-user-example-com

otel:
  exporterEndpoint: http://opentelemetry-collector.observability.svc.cluster.local:4317
  serviceNamespace: suse-private-ai
