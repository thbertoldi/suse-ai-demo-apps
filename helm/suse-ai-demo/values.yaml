gateway:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-gateway
    tag: latest
    pullPolicy: Always
  replicas: 1
  ragServiceAddr: rag-service:50052
  llmServiceAddr: llm-service:50053
  agentServiceAddr: agent-service:50054
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ragService:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-rag-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  llm:
    baseUrl: http://ollama.suse-private-ai.svc.cluster.local:11434/v1
    model: llama3.2
    provider: ollama
  embedding:
    baseUrl: http://ollama.suse-private-ai.svc.cluster.local:11434
    model: nomic-embed-text
  vectorDb:
    type: milvus
    url: http://milvus.suse-private-ai.svc.cluster.local:19530
    collection: demo-docs
    username: ""
    password: ""
  enableContentEvents: "false"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

llmService:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-llm-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  llm:
    baseUrl: http://ollama.suse-private-ai.svc.cluster.local:11434/v1
    model: llama3.2
    provider: ollama
  enableContentEvents: "false"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

agentService:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-agent-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  llm:
    baseUrl: http://ollama.suse-private-ai.svc.cluster.local:11434/v1
    model: llama3.2
    provider: ollama
  ragServiceAddr: rag-service:50052
  agentName: demo-agent
  maxIterations: "5"
  enableContentEvents: "false"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

trafficGen:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-traffic-gen
    tag: latest
    pullPolicy: Always
  enabled: true
  gatewayAddr: gateway:50051
  intervalSeconds: "5"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

otel:
  # NOTE: OTLP export uses plaintext gRPC (the SDK exporters set insecure=true). This is a
  # deliberate trade-off for in-cluster demo traffic to the collector. For non-demo use,
  # terminate TLS at the collector's OTLP receiver and switch to an https:// endpoint.
  exporterEndpoint: http://opentelemetry-collector.observability.svc.cluster.local:4317
  serviceNamespace: suse-private-ai
  # Reported as the deployment.environment.name resource attribute on all services.
  environment: demo
