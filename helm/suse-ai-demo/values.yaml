# All image tags default to Chart.appVersion. Set digest to pin an exact image.
# Pre-existing registry credentials in the release namespace, if needed.
imagePullSecrets: []

gateway:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-gateway
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  ragServiceAddr: rag-service:50052
  llmServiceAddr: llm-service:50053
  agentServiceAddr: agent-service:50054
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ragService:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-rag-service
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  llm:
    baseUrl: http://ollama.suse-private-ai.svc.cluster.local:11434/v1
    model: llama3.2
    provider: ollama
    existingSecret: ""
    apiKeyKey: api-key
  embedding:
    baseUrl: http://ollama.suse-private-ai.svc.cluster.local:11434
    model: nomic-embed-text
    provider: ollama
  vectorDb:
    type: milvus
    url: http://milvus.suse-private-ai.svc.cluster.local:19530
    collection: demo_docs
    username: ""
    password: ""
    # Optional Secret containing username/password; takes precedence over literals.
    existingSecret: ""
    usernameKey: username
    passwordKey: password
    opensearch:
      indexReplicas: 1
      # ConfigMap containing the trusted OpenSearch CA. TLS verification stays on.
      caConfigMap: ""
      caKey: ca.crt
  enableContentEvents: "false"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

llmService:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-llm-service
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  llm:
    baseUrl: http://ollama.suse-private-ai.svc.cluster.local:11434/v1
    model: llama3.2
    provider: ollama
    # Optional credential for a proxy such as LiteLLM.
    existingSecret: ""
    apiKeyKey: api-key
  enableContentEvents: "false"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

agentService:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-agent-service
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  llm:
    baseUrl: http://ollama.suse-private-ai.svc.cluster.local:11434/v1
    model: llama3.2
    provider: ollama
    existingSecret: ""
    apiKeyKey: api-key
  ragServiceAddr: rag-service:50052
  agentName: demo-agent
  maxIterations: "5"
  deterministicDemoTools: "true"
  enableContentEvents: "false"
  # The chart's direct Service selects the current Knative predictor pod and
  # avoids the Kubeflow browser/OIDC gateway used by the generated KServe URL.
  kservePredictUrl: http://suse-ai-sklearn-iris.kubeflow-user-example-com.svc.cluster.local/v1/models/sklearn-iris:predict
  modelRegistryUrl: http://model-registry-service.kubeflow.svc.cluster.local:8080
  # The default Kubeflow AuthorizationPolicy permits in-cluster API calls that
  # carry an Authorization header. Override or clear this token as appropriate.
  modelRegistryBearerToken: demo
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

trafficGen:
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-traffic-gen
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  enabled: true
  gatewayAddr: gateway:50051
  intervalSeconds: "5"
  # Enable only after deploying the Kubeflow lifecycle demo.
  enableKubeflowScenarios: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

webuiTraffic:
  enabled: false
  baseUrl: http://open-webui.suse-private-ai.svc.cluster.local:80
  model: llama3.2:latest
  intervalSeconds: 60
  maxRetries: 1
  streamEvery: 3
  maxTokens: 64
  # credentials.json must contain the email/password of a dedicated ordinary user.
  existingSecret: ""
  # Optional frozen webui.py ConfigMap when testing against an older traffic image.
  scriptConfigMap: ""

kubeflowPipeline:
  inferenceServiceName: sklearn-iris
  # The successful pipeline smoke-test creates/updates this stable Service so
  # it selects only the newest ready Knative revision.
  predictionServiceName: suse-ai-sklearn-iris
  rbac:
    enabled: false
    # KFP runs the demo steps as this service account. Grant it only the
    # namespaced KServe and credential-object permissions needed by deployment.
    serviceAccountName: default-editor
    serviceAccountNamespace: kubeflow-user-example-com
    kserveNamespace: kubeflow-user-example-com

otel:
  # NOTE: OTLP export uses plaintext gRPC (the SDK exporters set insecure=true). This is a
  # deliberate trade-off for in-cluster demo traffic to the collector. For non-demo use,
  # terminate TLS at the collector's OTLP receiver and switch to an https:// endpoint.
  exporterEndpoint: http://opentelemetry-collector.observability.svc.cluster.local:4317
  # Empty uses the Helm release namespace. Cluster identity comes from the Collector.
  serviceNamespace: ""
  # Reported as the deployment.environment.name resource attribute on all services.
  environment: demo

# Additional RAG Deployments/Services keyed by DNS name. Each entry overrides
# ragService values; see examples/native-products.yaml for Qdrant/OpenSearch.
additionalRagServices: {}

# Uses the RAG image, which includes app.product_traffic and its dependencies.
productTraffic:
  enabled: false
  # Select only installed products: vllm, litellm-vllm, qdrant, opensearch, mlflow, mcpo.
  scenarios: []
  intervalSeconds: 15
  # 0 runs continuously; a positive value exits after that many complete rounds.
  maxRounds: 0
  # Deadline for a finite product-traffic Job (maxRounds > 0).
  activeDeadlineSeconds: 900
  vllm:
    baseUrl: ""
    model: ""
    existingSecret: ""
    apiKeyKey: api-key
  litellm:
    baseUrl: ""
    model: ""
    existingSecret: ""
    apiKeyKey: api-key
  qdrantRagAddr: rag-qdrant:50052
  opensearchRagAddr: rag-opensearch:50052
  mlflow:
    baseUrl: ""
    experiment: native-product-traffic
    existingSecret: ""
    apiKeyKey: token
  mcpo:
    baseUrl: ""
    existingSecret: ""
    apiKeyKey: api-key
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# A bounded CPU training job; requires an MLflow server serving artifacts.
training:
  enabled: false
  image:
    repository: ghcr.io/thbertoldi/suse-ai-demo-training
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  schedule: "*/5 * * * *"
  suspend: false
  activeDeadlineSeconds: 300
  mlflow:
    baseUrl: ""
    experiment: native-pytorch-training
    existingSecret: ""
    apiKeyKey: token
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
