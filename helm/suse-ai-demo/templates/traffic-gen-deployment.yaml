{{- if .Values.trafficGen.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-gen
  labels:
    app: traffic-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-gen
  template:
    metadata:
      labels:
        app: traffic-gen
    spec:
      containers:
        - name: traffic-gen
          image: "{{ .Values.trafficGen.image.repository }}:{{ .Values.trafficGen.image.tag }}"
          imagePullPolicy: {{ .Values.trafficGen.image.pullPolicy }}
          env:
            - name: GATEWAY_ADDR
              value: {{ .Values.trafficGen.gatewayAddr | quote }}
            - name: INTERVAL_SECONDS
              value: {{ .Values.trafficGen.intervalSeconds | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "traffic-gen"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace={{ .Values.otel.serviceNamespace }},service.version={{ .Chart.AppVersion }},deployment.environment.name={{ .Values.otel.environment }},service.instance.id=$(POD_UID),suse.ai.managed=true,suse.ai.component.type=application,suse.ai.component.name=traffic-gen,k8s.pod.uid=$(POD_UID),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),suse.ai.demo=true"
          resources:
            {{- toYaml .Values.trafficGen.resources | nindent 12 }}
{{- end }}
