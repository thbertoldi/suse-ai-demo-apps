apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
  labels:
    app: llm-service
spec:
  replicas: {{ .Values.llmService.replicas }}
  selector:
    matchLabels:
      app: llm-service
  template:
    metadata:
      labels:
        app: llm-service
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: llm-service
          image: {{ include "suse-ai-demo.image" (dict "root" . "image" .Values.llmService.image) | quote }}
          imagePullPolicy: {{ .Values.llmService.image.pullPolicy }}
          ports:
            - containerPort: 50053
              protocol: TCP
          env:
            - name: GRPC_LISTEN_ADDR
              value: "[::]:50053"
            - name: LLM_BASE_URL
              value: {{ .Values.llmService.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llmService.llm.model | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.llmService.llm.provider | quote }}
            {{- if .Values.llmService.llm.existingSecret }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmService.llm.existingSecret | quote }}
                  key: {{ .Values.llmService.llm.apiKeyKey | quote }}
            {{- end }}
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: {{ .Values.llmService.enableContentEvents | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "llm-service"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace={{ .Values.otel.serviceNamespace | default .Release.Namespace }},service.version={{ .Chart.AppVersion }},deployment.environment.name={{ .Values.otel.environment }},service.instance.id=$(POD_UID),k8s.pod.uid=$(POD_UID),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),suse.ai.demo=true"
          readinessProbe:
            grpc:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.llmService.resources | nindent 12 }}
