{{- if hasKey .Values.additionalRagServices "rag-service" }}
{{- fail "Configure rag-service through ragService, not additionalRagServices" }}
{{- end }}
{{- range $name, $overrides := merge (dict "rag-service" (dict)) .Values.additionalRagServices }}
{{- $config := mergeOverwrite (deepCopy $.Values.ragService) $overrides }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $config.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "suse-ai-demo.image" (dict "root" $ "image" $config.image) | quote }}
          imagePullPolicy: {{ $config.image.pullPolicy }}
          ports:
            - containerPort: 50052
              protocol: TCP
          env:
            - name: GRPC_LISTEN_ADDR
              value: "[::]:50052"
            - name: LLM_BASE_URL
              value: {{ $config.llm.baseUrl | quote }}
            {{- include "suse-ai-demo.apiKeyEnv" (dict "env" "LLM_API_KEY" "config" $config.llm) | nindent 12 }}
            - name: LLM_MODEL
              value: {{ $config.llm.model | quote }}
            - name: LLM_PROVIDER
              value: {{ $config.llm.provider | quote }}
            - name: EMBEDDING_BASE_URL
              value: {{ $config.embedding.baseUrl | quote }}
            - name: EMBEDDING_MODEL
              value: {{ $config.embedding.model | quote }}
            - name: EMBEDDING_PROVIDER
              value: {{ $config.embedding.provider | quote }}
            - name: VECTOR_DB_TYPE
              value: {{ $config.vectorDb.type | quote }}
            - name: VECTOR_DB_URL
              value: {{ $config.vectorDb.url | quote }}
            - name: VECTOR_DB_COLLECTION
              value: {{ $config.vectorDb.collection | quote }}
            {{- if $config.vectorDb.existingSecret }}
            - name: VECTOR_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $config.vectorDb.existingSecret | quote }}
                  key: {{ $config.vectorDb.usernameKey | quote }}
            - name: VECTOR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $config.vectorDb.existingSecret | quote }}
                  key: {{ $config.vectorDb.passwordKey | quote }}
            {{- else }}
            {{- if $config.vectorDb.username }}
            - name: VECTOR_DB_USERNAME
              value: {{ $config.vectorDb.username | quote }}
            {{- end }}
            {{- if $config.vectorDb.password }}
            - name: VECTOR_DB_PASSWORD
              value: {{ $config.vectorDb.password | quote }}
            {{- end }}
            {{- end }}
            {{- if eq $config.vectorDb.type "opensearch" }}
            - name: OPENSEARCH_INDEX_REPLICAS
              value: {{ $config.vectorDb.opensearch.indexReplicas | quote }}
            {{- if $config.vectorDb.opensearch.caConfigMap }}
            - name: OPENSEARCH_CA_CERT
              value: /etc/opensearch-ca/ca.crt
            {{- end }}
            {{- end }}
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: {{ $config.enableContentEvents | quote }}
            {{- include "suse-ai-demo.otelEnv" (dict "root" $ "service" $name) | nindent 12 }}
          {{- if and (eq $config.vectorDb.type "opensearch") $config.vectorDb.opensearch.caConfigMap }}
          volumeMounts:
            - name: opensearch-ca
              mountPath: /etc/opensearch-ca
              readOnly: true
          {{- end }}
          readinessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml $config.resources | nindent 12 }}
      {{- if and (eq $config.vectorDb.type "opensearch") $config.vectorDb.opensearch.caConfigMap }}
      volumes:
        - name: opensearch-ca
          configMap:
            name: {{ $config.vectorDb.opensearch.caConfigMap | quote }}
            items:
              - key: {{ $config.vectorDb.opensearch.caKey | quote }}
                path: ca.crt
      {{- end }}
{{- end }}
